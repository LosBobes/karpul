# Production stack for a single Hetzner VPS.
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
services:
  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      CORS_ORIGINS: https://${DOMAIN}
      CORPORATE_CARS: ${CORPORATE_CARS:-}
    volumes:
      - karpul-data:/app/data

  frontend:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  karpul-data:
  caddy-data:
  caddy-config:

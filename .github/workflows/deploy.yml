name: Deploy to Hetzner

# Builds Karpul on the shared Hetzner server from source on every push to
# main, exactly like gamgee, iris and flora-find on the same box.
#
# HETZNER_HOST / HETZNER_USER / HETZNER_SSH_KEY (and optional HETZNER_PORT) are
# inherited from the LosBobes org secrets. The check-secrets job below no-ops
# the deploy until they exist.
#
# The deploy directory is HARD-CODED below, never read from a secret. The org
# also carries a DEPLOY_PATH secret that belongs to another app: on the first
# run this workflow inherited it and ran `docker compose up` inside that app's
# checkout. The path is fixed here and the remote script refuses to touch a
# directory whose git remote is not this repository.
#
# This expects /opt/karpul to already exist on the server as a clone of this
# repo with a filled-in .env, and the Caddy block appended. See
# docs/deployment-hetzner.md steps 1 to 5. Until that one-time bootstrap is
# done, the deploy job fails at the checkout guard.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys: overlapping runs race on the same compose project.
# Queue instead of cancelling so the in-flight deploy finishes cleanly.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# The deploy runs entirely over SSH; it needs no GitHub API write access.
permissions:
  contents: read

env:
  DEPLOY_PATH: /opt/karpul
  EXPECTED_REMOTE: LosBobes/karpul

jobs:
  check-secrets:
    name: Check deploy secrets are configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Look for the Hetzner secrets
        id: check
        env:
          HAS_HOST: ${{ secrets.HETZNER_HOST != '' }}
          HAS_USER: ${{ secrets.HETZNER_USER != '' }}
          HAS_KEY: ${{ secrets.HETZNER_SSH_KEY != '' }}
        run: |
          if [ "$HAS_HOST" = true ] && [ "$HAS_USER" = true ] && [ "$HAS_KEY" = true ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All deploy secrets present."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Hetzner deploy secrets are not fully configured (HETZNER_HOST, HETZNER_USER, HETZNER_SSH_KEY from the org). Skipping deploy. See docs/deployment-hetzner.md."
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    timeout-minutes: 20

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          port:     ${{ secrets.HETZNER_PORT || 22 }}
          # Give a busy box more than the default 30s to accept the connection.
          timeout: 90s
          envs: DEPLOY_PATH,EXPECTED_REMOTE
          script_stop: true
          script: |
            set -e
            echo "Deploy directory: $DEPLOY_PATH"
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "::error::$DEPLOY_PATH is not a git checkout. Do the one-time bootstrap in docs/deployment-hetzner.md first."
              exit 1
            fi
            cd "$DEPLOY_PATH"

            # Guard: only ever operate on a checkout of THIS repository. Other
            # apps share this server; never rebuild or restart one of them.
            remote="$(git remote get-url origin)"
            case "$remote" in
              *"$EXPECTED_REMOTE"*|*"$(echo "$EXPECTED_REMOTE" | tr 'A-Z' 'a-z')"*) ;;
              *)
                echo "::error::$DEPLOY_PATH is a checkout of '$remote', not $EXPECTED_REMOTE. Refusing to deploy."
                exit 1
                ;;
            esac
            if ! grep -q "karpul_data" docker-compose.prod.yml; then
              echo "::error::docker-compose.prod.yml in $DEPLOY_PATH is not Karpul's. Refusing to deploy."
              exit 1
            fi

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Building image..."
            # Runtime config (CORS_ORIGINS, CORPORATE_CARS) lives in the box's
            # .env next to docker-compose.prod.yml; compose reads it
            # automatically. Build first, while the current container keeps
            # serving, so downtime is only the brief recreate window below.
            docker compose -f docker-compose.prod.yml build

            echo "Recreating container..."
            # `up -d` recreates only what changed and starts the replacement
            # immediately; Caddy retries across the gap (see Caddyfile). The
            # named volume karpul_karpul_data is not touched.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Waiting for the app to report healthy..."
            for i in $(seq 1 30); do
              status="$(docker compose -f docker-compose.prod.yml ps --format '{{.Service}} {{.Health}}' | awk '$1=="app"{print $2}')"
              if [ "$status" = "healthy" ]; then
                echo "app healthy after ${i} checks"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "app did not become healthy; recent logs:"
                docker compose -f docker-compose.prod.yml logs --tail 50 app
                exit 1
              fi
              sleep 2
            done

            echo "Pruning old images..."
            docker image prune -f

            echo "Running containers:"
            docker compose -f docker-compose.prod.yml ps

name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write server .env from secrets
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          CORPORATE_CARS: ${{ secrets.CORPORATE_CARS }}
        run: |
          test -n "$DOMAIN" || { echo "DOMAIN secret is not set"; exit 1; }
          {
            echo "DOMAIN=$DOMAIN"
            echo "CORPORATE_CARS=$CORPORATE_CARS"
          } > deploy/.env

      - name: Sync repository to server
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_SSH_USER }}
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'frontend/dist' \
            --exclude 'backend/data' \
            ./ "$USER@$HOST:/opt/karpul/"

      - name: Build and restart containers
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_SSH_USER }}
        run: ssh "$USER@$HOST" 'bash /opt/karpul/deploy/deploy.sh'

      - name: Smoke test
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "https://$DOMAIN/api/health" | grep -q ok; then
              echo "healthy"; exit 0
            fi
            sleep 10
          done
          echo "health check failed" >&2; exit 1

name: Deploy to Hetzner

# Builds Karpul on the shared Hetzner server from source on every push to
# main, exactly like gamgee, iris and flora-find on the same box.
#
# HETZNER_HOST / HETZNER_USER / HETZNER_SSH_KEY (and optional HETZNER_PORT) are
# inherited from the LosBobes org secrets. The deploy directory is NOT a
# secret: it is pinned to /opt/karpul below so nothing inherited from the org
# (the sibling apps share a DEPLOY_PATH secret pointing at *their* checkout)
# can ever make this workflow rebuild another app's stack. The deploy script
# additionally refuses to run unless that directory is a clone of this very
# repository and its compose file defines the `app` service.
#
# This expects /opt/karpul to already exist on the server as a clone of this
# repo with a filled-in .env, and the Caddy block appended. See
# docs/deployment-hetzner.md steps 1 to 5. Until that one-time bootstrap is
# done, the deploy job fails with a clear message before touching anything.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys: overlapping runs race on the same compose project.
# Queue instead of cancelling so the in-flight deploy finishes cleanly.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# The deploy runs entirely over SSH; it needs no GitHub API write access.
permissions:
  contents: read

env:
  # Where Karpul lives on the box. Deliberately hard-coded (not a secret or
  # variable) so it cannot be overridden by an org-level value.
  DEPLOY_PATH: /opt/karpul

jobs:
  check-secrets:
    name: Check deploy secrets are configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Look for the Hetzner secrets
        id: check
        env:
          HAS_HOST: ${{ secrets.HETZNER_HOST != '' }}
          HAS_USER: ${{ secrets.HETZNER_USER != '' }}
          HAS_KEY: ${{ secrets.HETZNER_SSH_KEY != '' }}
        run: |
          if [ "$HAS_HOST" = true ] && [ "$HAS_USER" = true ] && [ "$HAS_KEY" = true ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All deploy secrets present."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Hetzner deploy secrets are not fully configured (HETZNER_HOST, HETZNER_USER, HETZNER_SSH_KEY from the org). Skipping deploy. See docs/deployment-hetzner.md."
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    timeout-minutes: 20

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          port:     ${{ secrets.HETZNER_PORT || 22 }}
          # Give a busy box more than the default 30s to accept the connection.
          timeout: 90s
          # MUST stay false. With script_stop: true the action does not run
          # this script as a script: it splits it on newlines and injects an
          # exit-code check after every single line, which lands *inside*
          # multi-line constructs and makes the remote bash fail to parse
          # ("syntax error near unexpected token `;'" right after the `case`
          # below). The `set -e` on the first line gives us fail-fast anyway,
          # and a non-zero exit still fails this step.
          script_stop: false
          script: |
            set -e
            DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
            EXPECTED_REPO="${{ github.repository }}"
            COMPOSE="docker compose -f docker-compose.prod.yml"

            echo "Checking ${DEPLOY_PATH} is the Karpul checkout..."
            # Refuse to touch anything unless the directory exists, is a git
            # clone of THIS repository, and its compose file has our service.
            # This is what stops a wrong path from rebuilding a sibling app.
            if [ ! -d "${DEPLOY_PATH}/.git" ]; then
              echo "::error::${DEPLOY_PATH} is not a git checkout. Bootstrap the server first (docs/deployment-hetzner.md, steps 1 to 5)."
              exit 1
            fi
            cd "${DEPLOY_PATH}"
            origin_url="$(git remote get-url origin | tr '[:upper:]' '[:lower:]')"
            expected="$(printf '%s' "${EXPECTED_REPO}" | tr '[:upper:]' '[:lower:]')"
            case "${origin_url}" in
              *"${expected}"|*"${expected}.git"|*"${expected}/"|*"${expected}.git/") ;;
              *)
                echo "::error::${DEPLOY_PATH} tracks '${origin_url}', not ${EXPECTED_REPO}. Refusing to deploy into another app's directory."
                exit 1
                ;;
            esac

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            if ! ${COMPOSE} config --services | grep -qx app; then
              echo "::error::docker-compose.prod.yml in ${DEPLOY_PATH} does not define the 'app' service. Refusing to deploy."
              exit 1
            fi

            echo "Building image..."
            # Runtime config (CORS_ORIGINS, CORPORATE_CARS) lives in the box's
            # .env next to docker-compose.prod.yml; compose reads it
            # automatically. Build first, while the current container keeps
            # serving, so downtime is only the brief recreate window below.
            ${COMPOSE} build

            echo "Recreating container..."
            # `up -d` recreates only what changed and starts the replacement
            # immediately; Caddy retries across the gap (see Caddyfile). The
            # named volume karpul_karpul_data is not touched.
            ${COMPOSE} up -d --remove-orphans

            echo "Waiting for the app to report healthy..."
            for i in $(seq 1 30); do
              status="$(${COMPOSE} ps --format '{{.Service}} {{.Health}}' | awk '$1=="app"{print $2}')"
              if [ "$status" = "healthy" ]; then
                echo "app healthy after ${i} checks"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "app did not become healthy; recent logs:"
                ${COMPOSE} logs --tail 50 app
                exit 1
              fi
              sleep 2
            done

            echo "Pruning old images..."
            docker image prune -f

            echo "Running containers:"
            ${COMPOSE} ps

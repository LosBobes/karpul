services:
  backend:
    build: ./backend
    environment:
      CORS_ORIGINS: http://localhost:8080
      # CORPORATE_CARS: "Skoda Octavia|B-123-XY|4;VW Transporter|B-456-ZZ|8"
    volumes:
      - karpul-data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  karpul-data:
